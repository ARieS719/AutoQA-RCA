name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate fault-injection demo cases
        run: python -m mock_data.fault_injection
      - name: Offline smoke: diagnose one case per track
        run: |
          python -m rca_engine.cli diagnose --case data_output/demo_cases/case_1_ui_crash --offline
          python -m rca_engine.cli diagnose --case data_output/demo_cases/case_2_can_congestion --offline
          python -m rca_engine.cli evaluate --offline
      - name: Run tests
        run: pytest -q
